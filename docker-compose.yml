services:
  collect-api:
    image: ${DOCKER_REGISTRY-}collectapi
    build:
      context: .
      dockerfile: src/SchoolAccount.Collect.Api/Dockerfile
    ports:
      - "5101:8080"

  seq:
    image: datalust/seq:2024.3
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "8081:80"
