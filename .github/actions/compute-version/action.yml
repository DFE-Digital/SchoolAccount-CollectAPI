name: Compute Version
description: >-
  Emits the short commit SHA and a convenience image tag.

outputs:
  sha:
    description: 8-character commit SHA, e.g. abc12345
    value: ${{ steps.compute.outputs.sha }}
  tag:
    description: Convenience image tag, e.g. sha-abc12345
    value: ${{ steps.compute.outputs.tag }}

runs:
  using: composite
  steps:
    - id: compute
      shell: bash
      run: |
        SHORT_SHA="${GITHUB_SHA::8}"
        
        {
          echo "sha=${SHORT_SHA}"
          echo "tag=sha-${SHORT_SHA}"
        } >> "$GITHUB_OUTPUT"

        echo "(sha ${SHORT_SHA})"