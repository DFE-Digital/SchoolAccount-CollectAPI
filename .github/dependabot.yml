version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    # A package goes in the first group it matches. Major updates outside the
    # test tooling still arrive as their own PRs, so breaking changes are
    # reviewed one at a time.
    groups:
      test-tooling:
        patterns:
          - "Microsoft.Testing.*"
          - "xunit*"
          - "NSubstitute"
          - "Shouldly"
          - "NetArchTest.Rules"
          - "RichardSzalay.MockHttp"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
