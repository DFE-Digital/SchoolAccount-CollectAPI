version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    # A package goes in the first group it matches. Major updates outside the
    # test tooling and OpenTelemetry groups get their own PRs, so breaking
    # changes are reviewed one at a time. OpenTelemetry packages depend on
    # each other's versions, so they're updated together.
    groups:
      test-tooling:
        patterns:
          - "Microsoft.Testing.*"
          - "xunit*"
          - "NSubstitute"
          - "Shouldly"
          - "NetArchTest.Rules"
          - "RichardSzalay.MockHttp"
      opentelemetry:
        patterns:
          - "OpenTelemetry.*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
